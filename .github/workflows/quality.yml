name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      ENVIRONMENT: test
      FRONTEND_URL: http://127.0.0.1:4173
      GROQ_API_KEY: test-groq-key
      GEMINI_API_KEY: test-gemini-key
      PINECONE_API_KEY: test-pinecone-key
      PINECONE_INDEX_NAME: test-index
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_JWT_SECRET: test-jwt-secret
      ASYNC_DOCUMENT_INGESTION_ENABLED: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        run: PYTHONPATH=. pytest -q tests

      - name: Validate database migration chain
        working-directory: .
        run: bash scripts/validate_migrations.sh

      - name: Validate compliance source catalog and applicability rules
        run: PYTHONPATH=. python ../scripts/validate_source_catalog.py ../supabase/seed/obligations.csv

      - name: Verify trust evaluation manifest
        run: |
          test "$(wc -l < ../evals/trust_scenarios.jsonl)" -eq 2000
          python ../scripts/generate_trust_evaluations.py
          git diff --exit-code -- ../evals/trust_scenarios.jsonl

  frontend:
    name: Frontend lint, build, and browser smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
